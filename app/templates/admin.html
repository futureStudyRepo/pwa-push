<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PWA Push Admin</title>
  <link rel="stylesheet" href="{{ url_for('static', path='app.css') }}">
</head>
<body>
  <main class="shell">
    <section class="hero">
      <p class="eyebrow">PWA Push Demo</p>
      <h1>관리자 메시지 발송</h1>
      <p class="copy">현재 저장된 구독 수: <strong>{{ subscription_count }}</strong></p>
    </section>

    <section class="panel">
      <label class="label" for="title">알림 제목</label>
      <input id="title" class="text-input" value="관리자 메시지">

      <label class="label" for="body">알림 내용</label>
      <textarea id="body" class="text-area" placeholder="구독자에게 보낼 메시지를 입력하세요"></textarea>

      <label class="label" for="url">클릭 시 이동 경로</label>
      <input id="url" class="text-input" value="/">

      <div class="button-row">
        <button id="send-button" type="button">푸시 보내기</button>
      </div>

      <pre id="result" class="result-box">발송 전</pre>
    </section>
  </main>

  <script src="{{ url_for('static', path='admin.js') }}"></script>
</body>
</html>
