<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PWA Push Demo</title>
  <meta name="theme-color" content="#0f766e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="PushDemo">
  <link rel="manifest" href="{{ url_for('static', path='manifest.webmanifest') }}">
  <link rel="icon" href="{{ url_for('static', path='icon-192.svg') }}">
  <link rel="apple-touch-icon" href="{{ url_for('static', path='icon-192.svg') }}">
  <link rel="stylesheet" href="{{ url_for('static', path='app.css') }}">
</head>
<body>
  <main class="shell">
    <section class="hero">
      <p class="eyebrow">PWA Push Demo</p>
      <h1>구독자 페이지</h1>
      <p class="copy">서비스워커를 등록하고 푸시 알림을 구독하면, 관리자가 보낸 메시지를 브라우저 알림으로 받을 수 있습니다.</p>
    </section>

    <section class="panel">
      <p class="label">VAPID Public Key</p>
      <code id="public-key">{{ public_key or "설정되지 않음" }}</code>
      <div class="button-row">
        <button id="install-button" type="button">앱처럼 설치</button>
        <button id="register-button" type="button">서비스워커 등록</button>
        <button id="subscribe-button" type="button">푸시 구독</button>
      </div>
      <p id="status" class="status">대기 중</p>
      <p class="hint">관리자 페이지는 <a href="/admin">/admin</a> 입니다.</p>
    </section>
  </main>

  <script src="{{ url_for('static', path='app.js') }}"></script>
</body>
</html>
